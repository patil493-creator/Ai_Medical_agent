
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | MediTrack AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f0faf7;
            font-family: Arial, sans-serif;
        }
        .auth-card {
            width: min(390px, 88%);
            padding: 32px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0, 70, 60, 0.12);
        }
        .brand { color: #087f70; font-size: 27px; font-weight: bold; }
        .subtitle { color: #667085; margin-bottom: 25px; }
        label { display: block; margin: 16px 0 7px; font-weight: 600; }
        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #d0d5dd;
            border-radius: 8px;
            font-size: 15px;
        }
        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #087f70;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .auth-link { text-align: center; margin-top: 20px; color: #475467; }
        .auth-link a { color: #087f70; font-weight: bold; }
        .message { padding: 10px; border-radius: 7px; background: #fff0f0; color: #a12626; }
    </style>
</head>
<body>
    <main class="auth-card">
        <div class="brand">MediTrack AI</div>
        <h2>Create Account</h2>
        <p class="subtitle">Register to start managing your medicines.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <p class="message">{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('register') }}">
            <label for="name">Full name</label>
            <input id="name" type="text" name="name"
                   placeholder="Enter your full name" required>

            <label for="email">Email address</label>
            <input id="email" type="email" name="email"
                   placeholder="Enter your email" required>

            <label for="password">Password</label>
            <input id="password" type="password" name="password"
                   placeholder="Minimum 8 characters" minlength="8" required>

            <button type="submit">Create Account</button>
        </form>

        <div class="auth-link">
            Already registered?
            <a href="{{ url_for('login') }}">Login</a>
        </div>
    </main>
</body>
</html>
